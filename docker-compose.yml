version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: resumeranker-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: recruitment_ai

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumeranker-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/recruitment_ai
      - CLIENT_URL=http://localhost:8080
      - AI_PROVIDER=gemini
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: resumeranker-client
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongodb_data:
